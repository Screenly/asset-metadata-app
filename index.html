<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset Metadata</title>
    <script src="screenly.js?version=1"></script>
  </head>
  <body>
    <auto-scaler
      reference-width="1920"
      reference-height="1080"
      orientation="auto"
    >
      <div id="app">
        <header class="topbar">
          <img id="brand-logo" class="brand-logo" alt="" hidden />
        </header>

        <main class="layout">
          <section class="hero">
            <div class="eyebrow">
              <span class="status-dot" aria-hidden="true"></span>
              <span>Screen</span>
            </div>
            <h1 class="screen-name" id="screen-name">N/A</h1>
            <div class="location" id="location-row" hidden>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"
                />
                <circle cx="12" cy="9.5" r="2.5" />
              </svg>
              <span id="location"></span>
            </div>
            <div class="label-chips" id="labels"></div>
          </section>

          <section class="specs" aria-label="Device details">
            <div class="spec">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="7" rx="2" />
                <rect x="3" y="13" width="18" height="7" rx="2" />
                <path d="M7 7.5h.01M7 16.5h.01" />
              </svg>
              <span class="spec-label">Hostname</span>
              <span class="spec-value" id="hostname">N/A</span>
            </div>
            <div class="spec">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="6" width="12" height="12" rx="2" />
                <rect x="9.5" y="9.5" width="5" height="5" rx="0.5" />
                <path
                  d="M9 2.5V6M15 2.5V6M9 18v3.5M15 18v3.5M2.5 9H6M2.5 15H6M18 9h3.5M18 15h3.5"
                />
              </svg>
              <span class="spec-label">Hardware</span>
              <span class="spec-value" id="hardware">N/A</span>
            </div>
            <div class="spec">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="6" cy="6" r="2.5" />
                <circle cx="6" cy="18" r="2.5" />
                <circle cx="18" cy="8" r="2.5" />
                <path d="M6 8.5v7M18 10.5c0 4-6 3-10.5 6" />
              </svg>
              <span class="spec-label">Version</span>
              <span class="spec-value" id="version">N/A</span>
            </div>
            <div class="spec">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="8" />
                <circle cx="12" cy="12" r="2" />
                <path d="M12 1.5V5M12 19v3.5M1.5 12H5M19 12h3.5" />
              </svg>
              <span class="spec-label">Coordinates</span>
              <span class="spec-value" id="coordinates">N/A</span>
            </div>
            <div class="spec">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5l3 2" />
              </svg>
              <span class="spec-label">Local Time</span>
              <span class="spec-value">
                <span id="local-time">N/A</span>
                <span class="spec-meta" id="timezone"></span>
              </span>
            </div>
            <div class="spec">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="2.5" y="4" width="19" height="13" rx="2" />
                <path d="M8 21h8M12 17v4" />
              </svg>
              <span class="spec-label">Display</span>
              <span class="spec-value" id="display">N/A</span>
            </div>
          </section>
        </main>
      </div>
    </auto-scaler>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
